name: Markdown and Asset Check

on:
  pull_request:
    paths: ["**.md", "assets/**", "scripts/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["**.md", "assets/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate local links, images, SVGs and duplicates
        run: python scripts/validate_assets.py
